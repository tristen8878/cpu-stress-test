<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CPU Benchmark</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    font-family: system-ui;
    background: #0b1220;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    transition: 0.3s;
  }

  body.light {
    background: #f2f4f8;
    color: #111;
  }

  .app {
    width: 420px;
  }

  .card {
    background: #111a2e;
    padding: 24px;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    transition: 0.3s;
    position: relative;
  }

  body.light .card {
    background: white;
  }

  .card.running {
    box-shadow: 0 0 25px #22c55e;
  }

  h1 {
    font-size: 18px;
    opacity: 0.8;
  }

  .score {
    font-size: 52px;
    font-weight: bold;
    margin: 20px 0;
  }

  .meta {
    font-size: 13px;
    opacity: 0.7;
  }

  input {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    margin: 10px 0;
    text-align: center;
  }

  .buttons {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }

  button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
  }

  #start { background: #22c55e; }
  #stop { background: #ef4444; }
  #theme { background: #3b82f6; }

  .progress-ring {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 50px;
    height: 50px;
  }

  .leaderboard {
    margin-top: 15px;
    padding: 12px;
    background: #0f172a;
    border-radius: 12px;
    font-size: 13px;
  }
</style>
</head>

<body>
<div class="app">

  <div class="card" id="card">

    <svg class="progress-ring">
      <circle cx="25" cy="25" r="20"
        stroke="#22c55e"
        stroke-width="4"
        fill="transparent"
        stroke-dasharray="125"
        stroke-dashoffset="125"
        id="ring"/>
    </svg>

    <h1>CPU Benchmark</h1>

    <input id="nameInput" placeholder="CPU Name..." />

    <div class="score" id="score">--</div>

    <div class="meta">
      <div id="threads">Threads: --</div>
      <div id="status">Ready</div>
    </div>

    <div class="buttons">
      <button id="start">Start</button>
      <button id="stop">Stop</button>
      <button id="theme">Theme</button>
    </div>

  </div>

  <div class="leaderboard">
    <h3>Leaderboard</h3>
    <div id="boardList">No results yet</div>
  </div>

</div>

<script src="main.js"></script>
</body>
</html>
