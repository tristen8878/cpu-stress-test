<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CPU Benchmark Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      background: #0f172a;
      color: white;
    }

    button {
      padding: 12px 24px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    #start { background: #22c55e; }
    #stop { background: #ef4444; }

    #status {
      margin-top: 15px;
      font-size: 18px;
    }

    #threads {
      margin-top: 10px;
      font-size: 16px;
      opacity: 0.9;
    }

    #score {
      margin-top: 10px;
      font-size: 22px;
      font-weight: bold;
    }

    #leaderboard {
      margin-top: 25px;
      display: inline-block;
      text-align: left;
      background: #111827;
      padding: 15px;
      border-radius: 10px;
      width: 320px;
    }

    #nameInput {
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-top: 10px;
      width: 200px;
    }
  </style>
</head>

<body>
  <h1>CPU Benchmark Test</h1>

  <input id="nameInput" placeholder="Enter CPU name..." />
  <br>

  <button id="start">Start 20s Benchmark</button>
  <button id="stop">Stop</button>

  <div id="status">Status: Idle</div>
  <div id="threads">Threads: --</div>
  <div id="score">Score: --</div>

  <div id="leaderboard">
    <h3>Leaderboard</h3>
    <div id="boardList">No runs yet</div>
  </div>

  <script src="main.js"></script>
</body>
</html>
